<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Redentor — App do Motorista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #2d3748;
    --accent: #f59e0b;
    --accent2: #3b82f6;
    --green: #10b981;
    --text: #e6edf3;
    --muted: #8b949e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    background: linear-gradient(180deg, #11161d, #0d1117);
    border-bottom: 1px solid var(--border);
    padding: 20px 18px 16px;
    text-align: center;
  }
  .brand {
    font-family: 'Barlow', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 1px;
    color: var(--accent);
  }
  .brand-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .wrap { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 22px 16px 40px; }
  .title {
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 4px;
  }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .empresa {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color .15s, transform .05s, background .15s;
    text-decoration: none;
    color: var(--text);
    position: relative;
  }
  .empresa:active { transform: scale(0.99); }
  .empresa:hover { border-color: var(--accent); background: var(--surface2); }
  .empresa-logo {
    width: 52px; height: 52px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: #000;
    flex-shrink: 0;
  }
  .empresa-info { flex: 1; min-width: 0; }
  .empresa-nome {
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 17px;
  }
  .empresa-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .empresa-seta { color: var(--muted); font-size: 20px; flex-shrink: 0; }
  .badge-ultima {
    position: absolute;
    top: 10px; right: 12px;
    background: var(--green);
    color: #04210f;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.3px;
  }
  .ultima-vez {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 22px;
  }
  .ultima-label { font-size: 11px; color: var(--green); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 700; }
  .btn-continuar {
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, var(--accent), #d97706);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'Barlow', sans-serif;
    font-weight: 800;
    font-size: 15px;
    width: 100%;
    cursor: pointer;
    text-decoration: none;
    justify-content: center;
  }
  .btn-continuar:active { transform: scale(0.99); }
  .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .foot { text-align: center; font-size: 11px; color: var(--muted); padding: 18px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">REDENTOR</div>
    <div class="brand-sub">App do Motorista</div>
  </div>

  <div class="wrap">
    <div id="continuarBox"></div>
    <div class="title">Escolha a empresa</div>
    <div class="subtitle">Selecione o cliente para ver as linhas do dia.</div>
    <div id="listaEmpresas"></div>
  </div>

  <div class="foot">Redentor Fretamento e Locadora</div>

<script>
  // ===== CATALOGO DE EMPRESAS =====
  // Para adicionar um novo cliente, basta acrescentar uma entrada aqui.
  // 'url' e o caminho do app do motorista daquele cliente.
  const EMPRESAS = [
    {
      id: 'redentor',
      nome: 'DSV',
      desc: 'Transporte de funcionarios · Sorocaba',
      cor: '#f59e0b',
      inicial: 'D',
      url: 'https://portal.redentortransporte.com.br/motorista.html'
    },
    {
      id: 'evamo',
      nome: 'Evamo',
      desc: 'Transporte de funcionarios · Sorocaba',
      cor: '#3b82f6',
      inicial: 'E',
      url: 'https://portal.redentortransporte.com.br/evamo/motorista.html'
    }
  ];

  const CHAVE_ULTIMA = 'hub_ultima_empresa';

  function getUltima() {
    try { return localStorage.getItem(CHAVE_ULTIMA) || ''; } catch(e) { return ''; }
  }
  function setUltima(id) {
    try { localStorage.setItem(CHAVE_ULTIMA, id); } catch(e) {}
  }

  function abrirEmpresa(emp) {
    setUltima(emp.id);
    window.location.href = emp.url;
  }

  function render() {
    const ultimaId = getUltima();
    const ultima = EMPRESAS.find(e => e.id === ultimaId);

    // Bloco "continuar" (ultima empresa escolhida)
    const cont = document.getElementById('continuarBox');
    if (ultima) {
      cont.innerHTML =
        '<div class="ultima-vez">' +
          '<div class="ultima-label">Continuar de onde parou</div>' +
          '<a class="btn-continuar" href="' + ultima.url + '" onclick="setUltima(\'' + ultima.id + '\')">' +
            '\uD83D\uDE90 Entrar em ' + ultima.nome +
          '</a>' +
        '</div>' +
        '<div class="divider">ou trocar de empresa</div>';
    } else {
      cont.innerHTML = '';
    }

    // Lista de empresas
    const lista = document.getElementById('listaEmpresas');
    lista.innerHTML = EMPRESAS.map(emp => {
      const ehUltima = emp.id === ultimaId;
      return '<a class="empresa" href="' + emp.url + '" onclick="setUltima(\'' + emp.id + '\')">' +
        (ehUltima ? '<span class="badge-ultima">ULTIMA</span>' : '') +
        '<div class="empresa-logo" style="background:' + emp.cor + '">' + emp.inicial + '</div>' +
        '<div class="empresa-info">' +
          '<div class="empresa-nome">' + emp.nome + '</div>' +
          '<div class="empresa-desc">' + emp.desc + '</div>' +
        '</div>' +
        '<div class="empresa-seta">\u203A</div>' +
      '</a>';
    }).join('');
  }

  render();
</script>
</body>
</html>
